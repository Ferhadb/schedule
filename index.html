<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Schedule</title>
  <style>
    /* ---------------------------------------------------------------
       Base & typography
    --------------------------------------------------------------- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2d3250;
      --accent: #6c72ff;
      --accent2: #a78bfa;
      --text: #e8eaf6;
      --muted: #8b8fb4;
      --red: #f87171;
      --lesson-bg: #1e2235;
      --no-lesson-bg: #161826;
      --radius: 12px;
      --radius-sm: 8px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      min-height: 100vh;
      padding: 24px 16px 48px;
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 28px;
    }

    /* ---------------------------------------------------------------
       Day cards
    --------------------------------------------------------------- */
    .week-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .day-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
    }

    .day-name {
      font-weight: 700;
      font-size: 0.95rem;
    }

    .day-date {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .lesson-badge {
      background: var(--accent);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      border-radius: 99px;
      padding: 2px 9px;
    }

    .lesson-badge.zero {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .lessons-list {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ---------------------------------------------------------------
       Individual lesson row
    --------------------------------------------------------------- */
    .lesson-row {
      background: var(--lesson-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .lesson-number {
      color: var(--accent2);
      font-weight: 700;
      font-size: 0.8rem;
      min-width: 20px;
      padding-top: 2px;
    }

    .lesson-info {
      flex: 1;
    }

    .lesson-subject {
      font-weight: 600;
      font-size: 0.88rem;
      line-height: 1.3;
      margin-bottom: 3px;
    }

    .lesson-subject.empty {
      color: var(--muted);
      font-style: italic;
      font-weight: 400;
    }

    .lesson-meta {
      font-size: 0.75rem;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .lesson-meta span::before {
      content: "·";
      margin-right: 4px;
    }
    .lesson-meta span:first-child::before { content: ""; margin: 0; }

    /* ---------------------------------------------------------------
       No-lesson day
    --------------------------------------------------------------- */
    .no-lessons {
      padding: 18px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.82rem;
      font-style: italic;
    }

    /* ---------------------------------------------------------------
       Meta footer
    --------------------------------------------------------------- */
    .meta-bar {
      text-align: center;
      margin-top: 32px;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .meta-bar a {
      color: var(--accent2);
      text-decoration: none;
    }

    .error-banner {
      background: rgba(248, 113, 113, 0.12);
      border: 1px solid var(--red);
      color: var(--red);
      border-radius: var(--radius-sm);
      padding: 14px 18px;
      max-width: 500px;
      margin: 0 auto 24px;
      text-align: center;
      font-size: 0.85rem;
    }

    /* ---------------------------------------------------------------
       Today highlight
    --------------------------------------------------------------- */
    .day-card.today {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .day-card.today .day-header {
      background: rgba(108, 114, 255, 0.12);
    }

    .today-tag {
      font-size: 0.65rem;
      font-weight: 700;
      background: var(--accent);
      color: #fff;
      border-radius: 99px;
      padding: 1px 7px;
      margin-left: 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <h1>📅 My Schedule</h1>
  <p class="subtitle" id="subtitle">Loading…</p>

  <div id="error-banner" class="error-banner" style="display:none"></div>

  <div class="week-grid" id="week-grid"></div>

  <div class="meta-bar" id="meta-bar"></div>

  <script>
    // ---------------------------------------------------------------
    // Helpers
    // ---------------------------------------------------------------
    const $ = id => document.getElementById(id);

    // Older versions stored lesson marks in localStorage; clean them up.
    try { localStorage.removeItem("lesson_toggles"); } catch {}

    function fmtDate(isoStr) {
      const d = new Date(isoStr + "T00:00:00");
      return d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
    }

    function todayISO() {
      return new Date().toISOString().slice(0, 10);
    }

    // ---------------------------------------------------------------
    // Render
    // ---------------------------------------------------------------
    function renderLesson(lesson) {
      const subjectText = lesson.subject || `Lesson ${lesson.number}`;
      const subjectClass = lesson.subject ? "" : "empty";

      const metaParts = [];
      if (lesson.start && lesson.end) metaParts.push(`${lesson.start}–${lesson.end}`);
      if (lesson.teacher)             metaParts.push(lesson.teacher);
      if (lesson.classroom)           metaParts.push(lesson.classroom);

      const metaHTML = metaParts.map(p => `<span>${p}</span>`).join("");

      return `
        <div class="lesson-row">
          <div class="lesson-number">${lesson.number}.</div>
          <div class="lesson-info">
            <div class="lesson-subject ${subjectClass}">${subjectText}</div>
            <div class="lesson-meta">${metaHTML}</div>
          </div>
        </div>`;
    }

    function renderDay(dayData) {
      const isToday = dayData.date === todayISO();
      const todayTag = isToday ? `<span class="today-tag">Today</span>` : "";

      const badgeClass = dayData.lesson_count === 0 ? "lesson-badge zero" : "lesson-badge";
      const badgeText = dayData.lesson_count === 0 ? "Free" : `${dayData.lesson_count} lesson${dayData.lesson_count !== 1 ? "s" : ""}`;

      let bodyHTML;
      if (dayData.lessons.length === 0) {
        bodyHTML = `<div class="no-lessons">No lessons — free day 🎉</div>`;
      } else {
        bodyHTML = `<div class="lessons-list">${dayData.lessons.map(renderLesson).join("")}</div>`;
      }

      return `
        <div class="day-card ${isToday ? "today" : ""}">
          <div class="day-header">
            <span class="day-name">${dayData.day}${todayTag}</span>
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="day-date">${fmtDate(dayData.date)}</span>
              <span class="${badgeClass}">${badgeText}</span>
            </div>
          </div>
          ${bodyHTML}
        </div>`;
    }

    // ---------------------------------------------------------------
    // Load data
    // ---------------------------------------------------------------
    async function load() {
      try {
        const res = await fetch("schedule.json?v=" + Date.now());
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        $("subtitle").textContent =
          `Week of ${fmtDate(data.week_start)}  ·  Updated ${data.fetched_at}`;

        const grid = $("week-grid");
        // Only show Mon–Fri by default; show Sat/Sun only if they have lessons
        const visibleDays = data.days.filter((d, i) => i < 5 || d.lesson_count > 0);
        grid.innerHTML = visibleDays.map(renderDay).join("");

        $("meta-bar").innerHTML =
          `Data fetched: <strong>${data.fetched_at}</strong> &nbsp;·&nbsp; ` +
          `<a href="https://ufaz.edupage.org" target="_blank" rel="noopener">Open Edupage ↗</a>`;

      } catch (err) {
        $("subtitle").textContent = "Could not load schedule";
        const banner = $("error-banner");
        banner.style.display = "";
        banner.textContent = `Failed to load schedule.json: ${err.message}. ` +
          `Make sure the GitHub Action has run at least once.`;
      }
    }

    load();
  </script>
</body>
</html>
