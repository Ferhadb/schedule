<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Schedule</title>
  <style>
    /* ---------------------------------------------------------------
       Base & typography
    --------------------------------------------------------------- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2d3250;
      --accent: #6c72ff;
      --accent2: #a78bfa;
      --text: #e8eaf6;
      --muted: #8b8fb4;
      --green: #4ade80;
      --red: #f87171;
      --lesson-bg: #1e2235;
      --no-lesson-bg: #161826;
      --radius: 12px;
      --radius-sm: 8px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      min-height: 100vh;
      padding: 24px 16px 48px;
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      user-select: none;
      -webkit-user-select: none;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 16px;
    }

    .office-summary {
      width: fit-content;
      max-width: 90%;
      margin: 0 auto 24px;
      padding: 7px 14px;
      border-radius: 99px;
      background: rgba(74, 222, 128, 0.10);
      border: 1px solid rgba(74, 222, 128, 0.35);
      color: var(--green);
      font-size: 0.8rem;
      font-weight: 600;
      text-align: center;
    }

    /* ---------------------------------------------------------------
       Day cards
    --------------------------------------------------------------- */
    .week-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .day-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
    }

    .day-name {
      font-weight: 700;
      font-size: 0.95rem;
    }

    .day-date {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .lesson-badge {
      background: var(--accent);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      border-radius: 99px;
      padding: 2px 9px;
    }

    .lesson-badge.zero {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .lessons-list {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ---------------------------------------------------------------
       Individual lesson row
    --------------------------------------------------------------- */
    .lesson-row {
      background: var(--lesson-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .lesson-number {
      color: var(--accent2);
      font-weight: 700;
      font-size: 0.8rem;
      min-width: 20px;
      padding-top: 2px;
    }

    .lesson-info {
      flex: 1;
    }

    .lesson-subject {
      font-weight: 600;
      font-size: 0.88rem;
      line-height: 1.3;
      margin-bottom: 3px;
    }

    .lesson-subject.empty {
      color: var(--muted);
      font-style: italic;
      font-weight: 400;
    }

    .lesson-group {
      display: inline-block;
      margin-left: 4px;
      padding: 1px 7px;
      border-radius: 99px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--accent2);
      font-size: 0.68rem;
      font-weight: 700;
      vertical-align: 1px;
      white-space: nowrap;
    }

    .lesson-office {
      display: inline-block;
      margin-left: 4px;
      padding: 1px 7px;
      border-radius: 99px;
      background: rgba(74, 222, 128, 0.14);
      border: 1px solid rgba(74, 222, 128, 0.45);
      color: var(--green);
      font-size: 0.68rem;
      font-weight: 700;
      vertical-align: 1px;
      white-space: nowrap;
    }

    .lesson-row.office {
      background: rgba(74, 222, 128, 0.10);
      border-color: rgba(74, 222, 128, 0.55);
      box-shadow: inset 3px 0 0 var(--green);
    }

    .edit-mode .lesson-row {
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
    }

    .edit-mode .lesson-row:hover {
      background: rgba(74, 222, 128, 0.08);
      border-color: rgba(74, 222, 128, 0.45);
    }

    .edit-mode .lesson-row.office:hover {
      background: rgba(74, 222, 128, 0.16);
    }

    .lesson-meta {
      font-size: 0.75rem;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .lesson-meta span::before {
      content: "·";
      margin-right: 4px;
    }
    .lesson-meta span:first-child::before { content: ""; margin: 0; }

    /* ---------------------------------------------------------------
       No-lesson day
    --------------------------------------------------------------- */
    .no-lessons {
      padding: 18px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.82rem;
      font-style: italic;
    }

    /* ---------------------------------------------------------------
       Meta footer
    --------------------------------------------------------------- */
    .meta-bar {
      text-align: center;
      margin-top: 32px;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .meta-bar a {
      color: var(--accent2);
      text-decoration: none;
    }

    .error-banner {
      background: rgba(248, 113, 113, 0.12);
      border: 1px solid var(--red);
      color: var(--red);
      border-radius: var(--radius-sm);
      padding: 14px 18px;
      max-width: 500px;
      margin: 0 auto 24px;
      text-align: center;
      font-size: 0.85rem;
    }

    /* ---------------------------------------------------------------
       Private token dialog
    --------------------------------------------------------------- */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: rgba(5, 7, 12, 0.78);
      z-index: 1000;
    }

    .modal {
      width: 100%;
      max-width: 440px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.55);
    }

    .modal h2 {
      font-size: 1.05rem;
      margin-bottom: 10px;
    }

    .modal p {
      color: var(--muted);
      font-size: 0.82rem;
      line-height: 1.45;
      margin-bottom: 14px;
    }

    .modal code {
      color: var(--accent2);
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
    }

    .modal input {
      width: 100%;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      font-size: 0.82rem;
    }

    .modal input:focus {
      outline: 2px solid var(--accent);
      outline-offset: 1px;
    }

    .modal-error {
      min-height: 1.2em;
      margin-top: 8px;
      color: var(--red);
      font-size: 0.78rem;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    .btn {
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      padding: 8px 14px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
    }

    .btn.primary {
      background: var(--accent);
      color: #fff;
    }

    .btn.secondary {
      background: transparent;
      border-color: var(--border);
      color: var(--muted);
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: default;
    }

    .modal-hint {
      margin: 14px 0 0 !important;
      font-size: 0.72rem !important;
    }

    .modal-hint a {
      color: var(--accent2);
      text-decoration: none;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%);
      max-width: min(92vw, 460px);
      padding: 10px 16px;
      border-radius: 99px;
      background: rgba(248, 113, 113, 0.16);
      border: 1px solid var(--red);
      color: var(--red);
      font-size: 0.8rem;
      font-weight: 600;
      text-align: center;
      z-index: 1100;
    }

    /* ---------------------------------------------------------------
       Today highlight
    --------------------------------------------------------------- */
    .day-card.today {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .day-card.today .day-header {
      background: rgba(108, 114, 255, 0.12);
    }

    .today-tag {
      font-size: 0.65rem;
      font-weight: 700;
      background: var(--accent);
      color: #fff;
      border-radius: 99px;
      padding: 1px 7px;
      margin-left: 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <h1 id="title">📅 My Schedule</h1>
  <p class="subtitle" id="subtitle">Loading…</p>

  <div class="office-summary" id="office-summary" hidden></div>

  <div id="error-banner" class="error-banner" style="display:none"></div>

  <div class="week-grid" id="week-grid"></div>

  <div class="meta-bar" id="meta-bar"></div>

  <div class="modal-backdrop" id="token-modal" hidden>
    <div class="modal">
      <h2>Private access</h2>
      <p>
        Paste a fine-grained token with <code>Contents: Read and write</code>
        access to <code>Ferhadb/schedule</code>.
      </p>
      <input
        type="password"
        id="token-input"
        placeholder="github_pat_…"
        autocomplete="off"
        spellcheck="false"
      />
      <div class="modal-error" id="token-error"></div>
      <div class="modal-actions">
        <button class="btn secondary" id="token-cancel" type="button">Cancel</button>
        <button class="btn primary" id="token-save" type="button">Unlock</button>
      </div>
      <p class="modal-hint">
        <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">
          Create a fine-grained token ↗
        </a>
      </p>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>

  <script>
    // ---------------------------------------------------------------
    // Config
    // ---------------------------------------------------------------
    const REPO_OWNER = "Ferhadb";
    const REPO_NAME = "schedule";
    const BRANCH = "main";
    const OFFICE_FILE = "office.json";
    const TOKEN_KEY = "office_edit_key";
    const EDIT_IDLE_MS = 10 * 60 * 1000;
    const SAVE_DEBOUNCE_MS = 500;

    // ---------------------------------------------------------------
    // State
    // ---------------------------------------------------------------
    let scheduleData = null;
    let officeData = { updated_at: null, days: {} };
    let lastSavedOfficeData = { updated_at: null, days: {} };
    let editMode = false;
    let titleClicks = 0;
    let titleClickTimer = null;
    let idleTimer = null;
    let saveTimer = null;
    let saveInFlight = false;
    let dirty = false;
    let memoryToken = "";
    let toastTimer = null;

    // ---------------------------------------------------------------
    // Helpers
    // ---------------------------------------------------------------
    const $ = id => document.getElementById(id);

    // Older versions stored lesson marks in localStorage; clean them up.
    try { localStorage.removeItem("lesson_toggles"); } catch {}

    function fmtDate(isoStr) {
      const d = new Date(isoStr + "T00:00:00");
      return d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
    }

    function todayISO() {
      const now = new Date();
      const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000);
      return local.toISOString().slice(0, 10);
    }

    function groupLabel(group) {
      const value = String(group).trim();
      return /^\d+$/.test(value) ? `Group ${value}` : value;
    }

    function minutes(hhmm) {
      const [h, m] = String(hhmm).split(":").map(Number);
      return Number.isFinite(h) && Number.isFinite(m) ? h * 60 + m : 0;
    }

    function clone(value) {
      return JSON.parse(JSON.stringify(value));
    }

    function toBase64(text) {
      const bytes = new TextEncoder().encode(text);
      let binary = "";
      for (const byte of bytes) binary += String.fromCharCode(byte);
      return btoa(binary);
    }

    // ---------------------------------------------------------------
    // Office data
    // ---------------------------------------------------------------
    function normalizeOffice(raw) {
      const days = {};
      if (raw && typeof raw === "object" && raw.days && typeof raw.days === "object") {
        for (const [date, entries] of Object.entries(raw.days)) {
          if (!Array.isArray(entries)) continue;
          const clean = entries
            .filter(entry => entry && typeof entry.start === "string" && typeof entry.end === "string")
            .map(entry => ({
              number: Number(entry.number) || 0,
              start: entry.start,
              end: entry.end,
            }))
            .sort((a, b) => a.start.localeCompare(b.start));
          if (clean.length) days[date] = clean;
        }
      }
      return {
        updated_at: raw && typeof raw.updated_at === "string" ? raw.updated_at : null,
        days,
      };
    }

    function isLessonOffice(date, lesson) {
      return (officeData.days[date] || []).some(
        entry => entry.start === lesson.start && entry.end === lesson.end
      );
    }

    function toggleLessonOffice(date, lesson) {
      const entries = officeData.days[date] || [];
      const index = entries.findIndex(
        entry => entry.start === lesson.start && entry.end === lesson.end
      );

      if (index >= 0) {
        entries.splice(index, 1);
      } else {
        entries.push({
          number: lesson.number,
          start: lesson.start,
          end: lesson.end,
        });
      }

      entries.sort((a, b) => a.start.localeCompare(b.start));
      if (entries.length) officeData.days[date] = entries;
      else delete officeData.days[date];

      officeData.updated_at = new Date().toISOString();
    }

    function officeRangesForDate(day) {
      const valid = new Set(day.lessons.map(lesson => `${lesson.start}-${lesson.end}`));
      const entries = (officeData.days[day.date] || []).filter(entry =>
        valid.has(`${entry.start}-${entry.end}`)
      );
      const ranges = [];

      for (const entry of entries) {
        const last = ranges[ranges.length - 1];
        if (last && minutes(entry.start) - minutes(last.end) <= 30) {
          last.end = entry.end;
        } else {
          ranges.push({ start: entry.start, end: entry.end });
        }
      }

      return ranges;
    }

    function buildOfficeSummary() {
      if (!scheduleData) return "";
      const parts = [];

      for (const day of scheduleData.days) {
        const ranges = officeRangesForDate(day);
        if (!ranges.length) continue;
        const label = day.day.slice(0, 3);
        const times = ranges.map(range => `${range.start}–${range.end}`).join(", ");
        parts.push(`${label} ${times}`);
      }

      return parts.length ? `🏢 Office: ${parts.join(" · ")}` : "";
    }

    // ---------------------------------------------------------------
    // Render
    // ---------------------------------------------------------------
    function renderLesson(date, lesson) {
      const subjectText = lesson.subject || `Lesson ${lesson.number}`;
      const subjectClass = lesson.subject ? "" : "empty";
      const isOffice = isLessonOffice(date, lesson);

      const groupLabels = Array.isArray(lesson.groups)
        ? lesson.groups.filter(Boolean).map(groupLabel)
        : [];
      const groupHTML = groupLabels.length
        ? `<span class="lesson-group">${groupLabels.join(", ")}</span>`
        : "";
      const officeHTML = isOffice
        ? `<span class="lesson-office">🏢 Office</span>`
        : "";

      const metaParts = [];
      if (lesson.start && lesson.end) metaParts.push(`${lesson.start}–${lesson.end}`);
      if (lesson.teacher) metaParts.push(lesson.teacher);
      if (lesson.classroom) metaParts.push(lesson.classroom);

      const metaHTML = metaParts.map(part => `<span>${part}</span>`).join("");

      return `
        <div class="lesson-row ${isOffice ? "office" : ""}"
             data-date="${date}"
             data-start="${lesson.start || ""}"
             data-end="${lesson.end || ""}"
             data-number="${lesson.number}">
          <div class="lesson-number">${lesson.number}.</div>
          <div class="lesson-info">
            <div class="lesson-subject ${subjectClass}">${subjectText}${groupHTML}${officeHTML}</div>
            <div class="lesson-meta">${metaHTML}</div>
          </div>
        </div>`;
    }

    function renderDay(dayData) {
      const isToday = dayData.date === todayISO();
      const todayTag = isToday ? `<span class="today-tag">Today</span>` : "";

      const badgeClass = dayData.lesson_count === 0 ? "lesson-badge zero" : "lesson-badge";
      const badgeText = dayData.lesson_count === 0 ? "Free" : `${dayData.lesson_count} lesson${dayData.lesson_count !== 1 ? "s" : ""}`;

      let bodyHTML;
      if (dayData.lessons.length === 0) {
        bodyHTML = `<div class="no-lessons">No lessons — free day 🎉</div>`;
      } else {
        bodyHTML = `<div class="lessons-list">${dayData.lessons.map(lesson => renderLesson(dayData.date, lesson)).join("")}</div>`;
      }

      return `
        <div class="day-card ${isToday ? "today" : ""}">
          <div class="day-header">
            <span class="day-name">${dayData.day}${todayTag}</span>
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="day-date">${fmtDate(dayData.date)}</span>
              <span class="${badgeClass}">${badgeText}</span>
            </div>
          </div>
          ${bodyHTML}
        </div>`;
    }

    function renderSummary() {
      const element = $("office-summary");
      const text = buildOfficeSummary();
      element.textContent = text;
      element.hidden = !text;
    }

    function renderGrid() {
      if (!scheduleData) return;
      const visibleDays = scheduleData.days.filter((day, index) => index < 5 || day.lesson_count > 0);
      $("week-grid").innerHTML = visibleDays.map(renderDay).join("");
    }

    function renderAll() {
      renderGrid();
      renderSummary();
    }

    // ---------------------------------------------------------------
    // Token + GitHub API
    // ---------------------------------------------------------------
    function getStoredToken() {
      try { return sessionStorage.getItem(TOKEN_KEY) || memoryToken; }
      catch { return memoryToken; }
    }

    function setStoredToken(token) {
      memoryToken = token;
      try { sessionStorage.setItem(TOKEN_KEY, token); } catch {}
    }

    function clearStoredToken() {
      memoryToken = "";
      try { sessionStorage.removeItem(TOKEN_KEY); } catch {}
    }

    async function apiRequest(path, token, options = {}) {
      const response = await fetch(`https://api.github.com${path}`, {
        ...options,
        headers: {
          "Accept": "application/vnd.github+json",
          "X-GitHub-Api-Version": "2022-11-28",
          "Authorization": `Bearer ${token}`,
          ...(options.headers || {}),
        },
      });

      if (!response.ok) {
        const error = new Error(`GitHub API ${response.status}`);
        error.status = response.status;
        error.body = await response.text().catch(() => "");
        throw error;
      }

      if (response.status === 204) return null;
      return response.json();
    }

    function officeApiPath() {
      return `/repos/${REPO_OWNER}/${REPO_NAME}/contents/${OFFICE_FILE}`;
    }

    function fetchOfficeMeta(token) {
      return apiRequest(`${officeApiPath()}?ref=${BRANCH}`, token);
    }

    async function saveOfficeData(state) {
      const token = getStoredToken();
      if (!token) throw Object.assign(new Error("No token"), { status: 401 });

      for (let attempt = 0; attempt < 2; attempt += 1) {
        let sha = null;
        try {
          const meta = await fetchOfficeMeta(token);
          sha = meta.sha;
        } catch (error) {
          if (error.status !== 404) throw error;
        }

        const content = JSON.stringify(state, null, 2) + "\n";
        const body = {
          message: "chore: update office hours [skip ci]",
          content: toBase64(content),
          branch: BRANCH,
        };
        if (sha) body.sha = sha;

        try {
          await apiRequest(officeApiPath(), token, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          return;
        } catch (error) {
          if (error.status === 409 && attempt === 0) continue;
          throw error;
        }
      }
    }

    // ---------------------------------------------------------------
    // Save queue
    // ---------------------------------------------------------------
    function queueOfficeSave() {
      dirty = true;
      clearTimeout(saveTimer);
      saveTimer = setTimeout(runOfficeSave, SAVE_DEBOUNCE_MS);
    }

    async function runOfficeSave() {
      if (saveInFlight) return;
      saveInFlight = true;

      while (dirty) {
        dirty = false;
        const snapshot = clone(officeData);
        try {
          await saveOfficeData(snapshot);
          lastSavedOfficeData = clone(snapshot);
        } catch (error) {
          officeData = clone(lastSavedOfficeData);
          renderAll();
          if (error.status === 401 || error.status === 403) {
            clearStoredToken();
            setEditMode(false);
            openTokenModal("Your token is invalid or expired. Paste a new one.");
          } else {
            showToast("Could not save office hours. Please try again.");
          }
          break;
        }
      }

      saveInFlight = false;
      if (dirty) queueOfficeSave();
    }

    // ---------------------------------------------------------------
    // Edit mode + secret gesture
    // ---------------------------------------------------------------
    function setEditMode(on) {
      editMode = on;
      document.body.classList.toggle("edit-mode", on);
      resetIdleTimer();
    }

    function resetIdleTimer() {
      clearTimeout(idleTimer);
      if (editMode) {
        idleTimer = setTimeout(() => setEditMode(false), EDIT_IDLE_MS);
      }
    }

    async function activateEditMode() {
      if (editMode) {
        setEditMode(false);
        return;
      }

      const token = getStoredToken();
      if (!token) {
        openTokenModal();
        return;
      }

      try {
        await fetchOfficeMeta(token);
        setEditMode(true);
      } catch (error) {
        if (error.status === 401 || error.status === 403) {
          clearStoredToken();
          openTokenModal("Your saved token is no longer valid. Paste a new one.");
        } else {
          setEditMode(true);
        }
      }
    }

    function handleTitleClick(event) {
      if (event.shiftKey) {
        titleClicks = 0;
        clearTimeout(titleClickTimer);
        openTokenModal();
        return;
      }

      titleClicks += 1;
      clearTimeout(titleClickTimer);
      titleClickTimer = setTimeout(() => { titleClicks = 0; }, 1800);

      if (titleClicks >= 5) {
        titleClicks = 0;
        clearTimeout(titleClickTimer);
        activateEditMode();
      }
    }

    // ---------------------------------------------------------------
    // Token dialog + toast
    // ---------------------------------------------------------------
    function openTokenModal(message = "") {
      if (editMode) resetIdleTimer();
      $("token-error").textContent = message;
      $("token-input").value = "";
      $("token-modal").hidden = false;
      setTimeout(() => $("token-input").focus(), 0);
    }

    function closeTokenModal() {
      $("token-modal").hidden = true;
      $("token-input").value = "";
      $("token-error").textContent = "";
    }

    async function connectToken() {
      const input = $("token-input");
      const token = input.value.trim();
      const errorElement = $("token-error");
      const button = $("token-save");

      if (!token) {
        errorElement.textContent = "Paste a token first.";
        return;
      }

      button.disabled = true;
      button.textContent = "Checking…";

      try {
        await fetchOfficeMeta(token);
        setStoredToken(token);
        closeTokenModal();
        setEditMode(true);
      } catch (error) {
        if (error.status === 401 || error.status === 403) {
          errorElement.textContent = "Token is invalid or has no access to this repo.";
        } else if (error.status === 404) {
          errorElement.textContent = "Token works, but office.json was not found in the repo.";
        } else {
          errorElement.textContent = "Could not verify the token. Check your connection and try again.";
        }
      } finally {
        button.disabled = false;
        button.textContent = "Unlock";
      }
    }

    function showToast(message) {
      const toast = $("toast");
      toast.textContent = message;
      toast.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toast.hidden = true; }, 4500);
    }

    // ---------------------------------------------------------------
    // Lesson clicks
    // ---------------------------------------------------------------
    function onGridClick(event) {
      if (!editMode || !scheduleData) return;

      const row = event.target.closest(".lesson-row");
      if (!row) return;

      const day = scheduleData.days.find(item => item.date === row.dataset.date);
      if (!day) return;

      const lesson = day.lessons.find(
        item => item.start === row.dataset.start && item.end === row.dataset.end
      );
      if (!lesson) return;

      toggleLessonOffice(day.date, lesson);
      renderAll();
      resetIdleTimer();
      queueOfficeSave();
    }

    // ---------------------------------------------------------------
    // Load data
    // ---------------------------------------------------------------
    async function loadOffice() {
      try {
        const response = await fetch(`${OFFICE_FILE}?v=${Date.now()}`, { cache: "no-store" });
        if (!response.ok) return;
        officeData = normalizeOffice(await response.json());
        lastSavedOfficeData = clone(officeData);
      } catch {}
    }

    async function load() {
      try {
        const [scheduleResponse] = await Promise.all([
          fetch("schedule.json?v=" + Date.now()),
          loadOffice(),
        ]);

        if (!scheduleResponse.ok) throw new Error(`HTTP ${scheduleResponse.status}`);
        scheduleData = await scheduleResponse.json();

        $("subtitle").textContent =
          `Week of ${fmtDate(scheduleData.week_start)}  ·  Updated ${scheduleData.fetched_at}`;

        renderAll();

        $("meta-bar").innerHTML =
          `Data fetched: <strong>${scheduleData.fetched_at}</strong> &nbsp;·&nbsp; ` +
          `<a href="https://ufaz.edupage.org" target="_blank" rel="noopener">Open Edupage ↗</a>`;
      } catch (error) {
        $("subtitle").textContent = "Could not load schedule";
        const banner = $("error-banner");
        banner.style.display = "";
        banner.textContent = `Failed to load schedule.json: ${error.message}. ` +
          `Make sure the GitHub Action has run at least once.`;
      }
    }

    async function refreshOffice() {
      if (!scheduleData || editMode || saveInFlight || dirty) return;
      if (!$("token-modal").hidden) return;

      const before = JSON.stringify(officeData);
      await loadOffice();
      if (JSON.stringify(officeData) === before) return;

      const scrollY = window.scrollY;
      renderAll();
      window.scrollTo(0, scrollY);
    }

    // ---------------------------------------------------------------
    // Wire up
    // ---------------------------------------------------------------
    $("title").addEventListener("click", handleTitleClick);
    $("week-grid").addEventListener("click", onGridClick);
    $("token-cancel").addEventListener("click", closeTokenModal);
    $("token-save").addEventListener("click", connectToken);
    $("token-input").addEventListener("keydown", event => {
      if (event.key === "Enter") connectToken();
    });
    $("token-modal").addEventListener("click", event => {
      if (event.target === $("token-modal")) closeTokenModal();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && !$("token-modal").hidden) closeTokenModal();
    });
    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) refreshOffice();
    });

    load().finally(() => setInterval(refreshOffice, 60000));
  </script>
</body>
</html>
