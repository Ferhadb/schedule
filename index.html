<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Schedule</title>
  <style>
    /* ---------------------------------------------------------------
       Base & typography
    --------------------------------------------------------------- */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2d3250;
      --accent: #6c72ff;
      --accent2: #a78bfa;
      --text: #e8eaf6;
      --muted: #8b8fb4;
      --green: #4ade80;
      --amber: #fbbf24;
      --red: #f87171;
      --lesson-bg: #1e2235;
      --no-lesson-bg: #161826;
      --radius: 12px;
      --radius-sm: 8px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", "Segoe UI", system-ui, sans-serif;
      min-height: 100vh;
      padding: 24px 16px 48px;
    }

    h1 {
      text-align: center;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 4px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.85rem;
      margin-bottom: 28px;
    }

    /* ---------------------------------------------------------------
       Legend
    --------------------------------------------------------------- */
    .legend {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 28px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .legend-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
    }

    /* ---------------------------------------------------------------
       Day cards
    --------------------------------------------------------------- */
    .week-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .day-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .day-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 16px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
    }

    .day-name {
      font-weight: 700;
      font-size: 0.95rem;
    }

    .day-date {
      color: var(--muted);
      font-size: 0.78rem;
    }

    .lesson-badge {
      background: var(--accent);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 700;
      border-radius: 99px;
      padding: 2px 9px;
    }

    .lesson-badge.zero {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
    }

    .lessons-list {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ---------------------------------------------------------------
       Individual lesson row
    --------------------------------------------------------------- */
    .lesson-row {
      background: var(--lesson-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .lesson-number {
      color: var(--accent2);
      font-weight: 700;
      font-size: 0.8rem;
      min-width: 20px;
      padding-top: 2px;
    }

    .lesson-info {
      flex: 1;
    }

    .lesson-subject {
      font-weight: 600;
      font-size: 0.88rem;
      line-height: 1.3;
      margin-bottom: 3px;
    }

    .lesson-subject.empty {
      color: var(--muted);
      font-style: italic;
      font-weight: 400;
    }

    .lesson-meta {
      font-size: 0.75rem;
      color: var(--muted);
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .lesson-meta span::before {
      content: "·";
      margin-right: 4px;
    }
    .lesson-meta span:first-child::before { content: ""; margin: 0; }

    /* ---------------------------------------------------------------
       Toggle buttons (online / skippable)
    --------------------------------------------------------------- */
    .lesson-toggles {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: flex-end;
      flex-shrink: 0;
    }

    .toggle-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 99px;
      border: 1px solid transparent;
      cursor: pointer;
      background: transparent;
      color: var(--muted);
      border-color: var(--border);
      transition: all 0.15s ease;
      white-space: nowrap;
    }

    .toggle-btn:hover { opacity: 0.85; }

    .toggle-btn.active-online {
      background: rgba(74, 222, 128, 0.15);
      border-color: var(--green);
      color: var(--green);
    }

    .toggle-btn.active-skip {
      background: rgba(251, 191, 36, 0.15);
      border-color: var(--amber);
      color: var(--amber);
    }

    .toggle-btn svg {
      width: 11px; height: 11px;
      flex-shrink: 0;
    }

    /* ---------------------------------------------------------------
       No-lesson day
    --------------------------------------------------------------- */
    .no-lessons {
      padding: 18px 16px;
      text-align: center;
      color: var(--muted);
      font-size: 0.82rem;
      font-style: italic;
    }

    /* ---------------------------------------------------------------
       Meta footer
    --------------------------------------------------------------- */
    .meta-bar {
      text-align: center;
      margin-top: 32px;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .meta-bar a {
      color: var(--accent2);
      text-decoration: none;
    }

    .error-banner {
      background: rgba(248, 113, 113, 0.12);
      border: 1px solid var(--red);
      color: var(--red);
      border-radius: var(--radius-sm);
      padding: 14px 18px;
      max-width: 500px;
      margin: 0 auto 24px;
      text-align: center;
      font-size: 0.85rem;
    }

    /* ---------------------------------------------------------------
       Today highlight
    --------------------------------------------------------------- */
    .day-card.today {
      border-color: var(--accent);
      box-shadow: 0 0 0 1px var(--accent);
    }

    .day-card.today .day-header {
      background: rgba(108, 114, 255, 0.12);
    }

    .today-tag {
      font-size: 0.65rem;
      font-weight: 700;
      background: var(--accent);
      color: #fff;
      border-radius: 99px;
      padding: 1px 7px;
      margin-left: 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
  </style>
</head>
<body>

  <h1>📅 My Schedule</h1>
  <p class="subtitle" id="subtitle">Loading…</p>

  <div id="error-banner" class="error-banner" style="display:none"></div>

  <div class="legend">
    <div class="legend-item">
      <div class="legend-dot" style="background:var(--green)"></div>
      <span>Online — I can come to work</span>
    </div>
    <div class="legend-item">
      <div class="legend-dot" style="background:var(--amber)"></div>
      <span>Skippable — I can skip without absence</span>
    </div>
  </div>

  <div class="week-grid" id="week-grid"></div>

  <div class="meta-bar" id="meta-bar"></div>

  <script>
    // ---------------------------------------------------------------
    // Helpers
    // ---------------------------------------------------------------
    const $ = id => document.getElementById(id);

    function fmtDate(isoStr) {
      const d = new Date(isoStr + "T00:00:00");
      return d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
    }

    function todayISO() {
      return new Date().toISOString().slice(0, 10);
    }

    // ---------------------------------------------------------------
    // localStorage toggle state
    // key: "toggles" → { "2026-10-28_1_online": true, ... }
    // ---------------------------------------------------------------
    const STATE_KEY = "lesson_toggles";

    function getState() {
      try { return JSON.parse(localStorage.getItem(STATE_KEY) || "{}"); }
      catch { return {}; }
    }

    function saveState(state) {
      localStorage.setItem(STATE_KEY, JSON.stringify(state));
    }

    function toggleKey(date, lessonNum, type) {
      return `${date}_${lessonNum}_${type}`;
    }

    // ---------------------------------------------------------------
    // Render
    // ---------------------------------------------------------------
    function renderLesson(dayDate, lesson) {
      const state = getState();
      const onlineKey = toggleKey(dayDate, lesson.number, "online");
      const skipKey   = toggleKey(dayDate, lesson.number, "skip");
      const isOnline  = !!state[onlineKey];
      const isSkip    = !!state[skipKey];

      const subjectText = lesson.subject || `Lesson ${lesson.number}`;
      const subjectClass = lesson.subject ? "" : "empty";

      const metaParts = [];
      if (lesson.start && lesson.end) metaParts.push(`${lesson.start}–${lesson.end}`);
      if (lesson.teacher)             metaParts.push(lesson.teacher);
      if (lesson.classroom)           metaParts.push(lesson.classroom);

      const metaHTML = metaParts.map(p => `<span>${p}</span>`).join("");

      return `
        <div class="lesson-row" data-date="${dayDate}" data-num="${lesson.number}">
          <div class="lesson-number">${lesson.number}.</div>
          <div class="lesson-info">
            <div class="lesson-subject ${subjectClass}">${subjectText}</div>
            <div class="lesson-meta">${metaHTML}</div>
          </div>
          <div class="lesson-toggles">
            <button
              class="toggle-btn ${isOnline ? 'active-online' : ''}"
              data-key="${onlineKey}"
              data-type="online"
              data-partner="${skipKey}"
              title="Mark as Online (I can come to office)"
            >
              <svg viewBox="0 0 16 16" fill="currentColor">
                <path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm3.75 5.97-4.2 4.2a.75.75 0 0 1-1.06 0l-1.69-1.69a.75.75 0 1 1 1.06-1.06l1.16 1.16 3.67-3.67a.75.75 0 1 1 1.06 1.06z"/>
              </svg>
              Online
            </button>
            <button
              class="toggle-btn ${isSkip ? 'active-skip' : ''}"
              data-key="${skipKey}"
              data-type="skip"
              data-partner="${onlineKey}"
              title="Mark as Skippable (no absence)"
            >
              <svg viewBox="0 0 16 16" fill="currentColor">
                <path d="M3.75 7.25a.75.75 0 0 0 0 1.5h8.5a.75.75 0 0 0 0-1.5h-8.5z"/>
              </svg>
              Skip
            </button>
          </div>
        </div>`;
    }

    function renderDay(dayData) {
      const isToday = dayData.date === todayISO();
      const todayTag = isToday ? `<span class="today-tag">Today</span>` : "";

      const badgeClass = dayData.lesson_count === 0 ? "lesson-badge zero" : "lesson-badge";
      const badgeText = dayData.lesson_count === 0 ? "Free" : `${dayData.lesson_count} lesson${dayData.lesson_count !== 1 ? "s" : ""}`;

      let bodyHTML;
      if (dayData.lessons.length === 0) {
        bodyHTML = `<div class="no-lessons">No lessons — free day 🎉</div>`;
      } else {
        bodyHTML = `<div class="lessons-list">${dayData.lessons.map(l => renderLesson(dayData.date, l)).join("")}</div>`;
      }

      return `
        <div class="day-card ${isToday ? "today" : ""}">
          <div class="day-header">
            <span class="day-name">${dayData.day}${todayTag}</span>
            <div style="display:flex;align-items:center;gap:8px;">
              <span class="day-date">${fmtDate(dayData.date)}</span>
              <span class="${badgeClass}">${badgeText}</span>
            </div>
          </div>
          ${bodyHTML}
        </div>`;
    }

    // ---------------------------------------------------------------
    // Wire up toggle buttons (event delegation)
    // ---------------------------------------------------------------
    document.getElementById("week-grid").addEventListener("click", e => {
      const btn = e.target.closest(".toggle-btn");
      if (!btn) return;

      const state   = getState();
      const key     = btn.dataset.key;
      const type    = btn.dataset.type;
      const partner = btn.dataset.partner;

      const wasActive = !!state[key];

      // Toggle this button; clear partner if activating
      if (!wasActive) {
        state[key] = true;
        delete state[partner];
      } else {
        delete state[key];
      }

      saveState(state);

      // Re-render just that button and its partner
      const row = btn.closest(".lesson-row");
      const allBtns = row.querySelectorAll(".toggle-btn");
      allBtns.forEach(b => {
        const k = b.dataset.key;
        const t = b.dataset.type;
        b.classList.remove("active-online", "active-skip");
        if (state[k]) {
          b.classList.add(t === "online" ? "active-online" : "active-skip");
        }
      });
    });

    // ---------------------------------------------------------------
    // Load data
    // ---------------------------------------------------------------
    async function load() {
      try {
        const res = await fetch("schedule.json?v=" + Date.now());
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        $("subtitle").textContent =
          `Week of ${fmtDate(data.week_start)}  ·  Updated ${data.fetched_at}`;

        const grid = $("week-grid");
        // Only show Mon–Fri by default; show Sat/Sun only if they have lessons
        const visibleDays = data.days.filter((d, i) => i < 5 || d.lesson_count > 0);
        grid.innerHTML = visibleDays.map(renderDay).join("");

        $("meta-bar").innerHTML =
          `Data fetched: <strong>${data.fetched_at}</strong> &nbsp;·&nbsp; ` +
          `Marks stored locally in your browser &nbsp;·&nbsp; ` +
          `<a href="https://ufaz.edupage.org" target="_blank" rel="noopener">Open Edupage ↗</a>`;

      } catch (err) {
        $("subtitle").textContent = "Could not load schedule";
        const banner = $("error-banner");
        banner.style.display = "";
        banner.textContent = `Failed to load schedule.json: ${err.message}. ` +
          `Make sure the GitHub Action has run at least once.`;
      }
    }

    load();
  </script>
</body>
</html>
